apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: agent-relay
type: Opaque
stringData:
  POSTGRES_USER: relay
  POSTGRES_PASSWORD: relay
  POSTGRES_DB: relay
  # The API reads its whole connection string from here, so the password is
  # never duplicated into a ConfigMap or a pod spec. "postgres" is the
  # Service name, which is the DNS name the API resolves inside the cluster.
  RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/relay
